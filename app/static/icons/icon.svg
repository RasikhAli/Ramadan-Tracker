<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744"/>
      <stop offset="100%" style="stop-color:#0f1729"/>
    </linearGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c14b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Mosque silhouette -->
  <path d="M256 80 L296 140 L296 200 L320 200 L320 140 L360 200 L360 280 L380 280 L380 240 L420 300 L420 380 L92 380 L92 300 L132 240 L132 280 L152 280 L152 200 L192 140 L192 200 L216 200 L216 140 Z" fill="#1e3a5f" opacity="0.5"/>
  
  <!-- Main dome -->
  <ellipse cx="256" cy="180" rx="60" ry="50" fill="#2a4a6f"/>
  <rect x="196" y="180" width="120" height="100" fill="#2a4a6f"/>
  
  <!-- Crescent moon -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="35" fill="url(#moon)"/>
    <circle cx="12" cy="-5" r="28" fill="url(#bg)"/>
    <!-- Star -->
    <polygon points="45,-20 48,-12 56,-12 50,-7 52,0 45,-5 38,0 40,-7 34,-12 42,-12" fill="url(#moon)" transform="scale(0.6)"/>
  </g>
  
  <!-- Minarets -->
  <rect x="100" y="200" width="30" height="180" fill="#2a4a6f"/>
  <ellipse cx="115" cy="200" rx="20" ry="25" fill="#2a4a6f"/>
  <circle cx="115" cy="175" r="8" fill="url(#moon)"/>
  
  <rect x="382" y="200" width="30" height="180" fill="#2a4a6f"/>
  <ellipse cx="397" cy="200" rx="20" ry="25" fill="#2a4a6f"/>
  <circle cx="397" cy="175" r="8" fill="url(#moon)"/>
  
  <!-- Door -->
  <rect x="226" y="300" width="60" height="80" rx="30" fill="#0f1729"/>
  <rect x="226" y="330" width="60" height="50" fill="#0f1729"/>
  
  <!-- Stars decoration -->
  <circle cx="80" cy="100" r="2" fill="#f0c14b" opacity="0.6"/>
  <circle cx="430" cy="120" r="2" fill="#f0c14b" opacity="0.6"/>
  <circle cx="150" cy="80" r="1.5" fill="#f0c14b" opacity="0.4"/>
  <circle cx="360" cy="90" r="1.5" fill="#f0c14b" opacity="0.4"/>
  <circle cx="200" cy="60" r="1" fill="#f0c14b" opacity="0.3"/>
  <circle cx="310" cy="70" r="1" fill="#f0c14b" opacity="0.3"/>
</svg>